[package]
name = "may-music"
version = "0.1.0"
edition = "2024"
description = "A small native Linux player for YouTube audio"
license = "MIT"

[dependencies]
anyhow = "1"
async-channel = "2"
gtk = { package = "gtk4", version = "0.10" }
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

